<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐖 Nueva Venta</title>
    <link rel="stylesheet" href="css/estilo.css">
    <style>
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2d7d46;
            box-shadow: 0 0 0 3px rgba(45, 125, 70, 0.2);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: 600;
        }
        .btn-volver {
            display: inline-block;
            margin-top: 15px;
            background: #666;
        }
        .btn-volver:hover {
            background: #444;
        }
        .mensaje-exito {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        .mensaje-error {
            background: #ffebee;
            color: #d32f2f;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        .mostrar {
            display: block !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- MENU -->
        <nav>
            <h1>🐖 PORCINOS</h1>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="ventas.html" class="active">Ventas</a></li>
                <li><a href="gastos.html">Gastos</a></li>
            </ul>
        </nav>

        <div class="form-container">
            <h2>📝 Nueva Venta</h2>
            <p style="color: #666; margin-bottom: 20px;">Registra una nueva venta de carne o cerdo</p>

            <!-- Mensajes -->
            <div id="mensaje-exito" class="mensaje-exito">✅ Venta registrada exitosamente</div>
            <div id="mensaje-error" class="mensaje-error">❌ Error al registrar la venta</div>

            <!-- Formulario -->
            <form id="form-nueva-venta">
                <div class="form-group">
                    <label for="nombre">Nombre del comprador *</label>
                    <input type="text" id="nombre" placeholder="Ej: Pedro Pérez" required>
                </div>

                <div class="form-group">
                    <label for="producto">Producto *</label>
                    <input type="text" id="producto" placeholder="Ej: Cerdo 85kg" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="valor">Valor total ($) *</label>
                        <input type="number" id="valor" placeholder="598500" required min="1">
                    </div>
                    <div class="form-group">
                        <label for="pago-inicial">Pago inicial ($)</label>
                        <input type="number" id="pago-inicial" placeholder="300000" min="0" value="0">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="metodo-pago">Método de pago *</label>
                        <select id="metodo-pago" required>
                            <option value="efectivo">💵 Efectivo</option>
                            <option value="transferencia">🏦 Transferencia</option>
                            <option value="nequi">📱 Nequi</option>
                            <option value="daviplata">📱 Daviplata</option>
                            <option value="pendiente">⏳ Pendiente</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fecha-sacrificio">Fecha de sacrificio</label>
                        <input type="date" id="fecha-sacrificio">
                    </div>
                </div>

                <button type="submit" class="btn btn-submit">✅ Registrar Venta</button>
            </form>

            <a href="ventas.html" class="btn btn-volver">⬅ Volver a Ventas</a>
        </div>

        <footer>
            <p>🐖 Sistema de Gestión Porcina v1.0</p>
        </footer>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { supabaseClient } from './js/config.js';

        console.log("📄 Formulario de nueva venta cargado");

        const form = document.getElementById('form-nueva-venta');
        const mensajeExito = document.getElementById('mensaje-exito');
        const mensajeError = document.getElementById('mensaje-error');

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            // Ocultar mensajes anteriores
            mensajeExito.classList.remove('mostrar');
            mensajeError.classList.remove('mostrar');

            // Obtener datos del formulario
            const nombre = document.getElementById('nombre').value.trim();
            const producto = document.getElementById('producto').value.trim();
            const valor = parseFloat(document.getElementById('valor').value);
            const pagoInicial = parseFloat(document.getElementById('pago-inicial').value) || 0;
            const metodoPago = document.getElementById('metodo-pago').value;
            const fechaSacrificio = document.getElementById('fecha-sacrificio').value || null;

            // Validar
            if (!nombre || !producto || !valor || valor <= 0) {
                mensajeError.textContent = '❌ Por favor, completa todos los campos obligatorios';
                mensajeError.classList.add('mostrar');
                return;
            }

            if (pagoInicial > valor) {
                mensajeError.textContent = '❌ El pago inicial no puede ser mayor al valor total';
                mensajeError.classList.add('mostrar');
                return;
            }

            try {
                // Insertar en Supabase
                const { data, error } = await supabaseClient
                    .from('ingresos')
                    .insert([
                        {
                            nombre: nombre,
                            producto: producto,
                            valor: valor,
                            pago_realizado: pagoInicial,
                            metodo_pago: metodoPago,
                            fecha_sacrificio: fechaSacrificio,
                            fecha_pago: pagoInicial > 0 ? new Date().toISOString().split('T')[0] : null
                        }
                    ]);

                if (error) {
                    console.error('❌ Error:', error);
                    mensajeError.textContent = `❌ Error al registrar: ${error.message}`;
                    mensajeError.classList.add('mostrar');
                    return;
                }

                // Éxito
                mensajeExito.textContent = `✅ Venta registrada exitosamente para "${nombre}"`;
                mensajeExito.classList.add('mostrar');

                // Limpiar formulario
                form.reset();
                document.getElementById('pago-inicial').value = 0;

                // Después de 2 segundos, redirigir
                setTimeout(() => {
                    window.location.href = 'ventas.html';
                }, 2000);

            } catch (error) {
                console.error('❌ Error:', error);
                mensajeError.textContent = `❌ Error inesperado: ${error.message}`;
                mensajeError.classList.add('mostrar');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐖 Nueva Venta</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- MENU -->
        <nav>
            <h1>🐖 PORCINOS</h1>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="ventas.html" class="active">Ventas</a></li>
                <li><a href="gastos.html">Gastos</a></li>
            </ul>
        </nav>

        <div class="form-container">
            <h2>📝 Nueva Venta</h2>
            <p style="color: #666; margin-bottom: 20px;">Registra una nueva venta de carne o cerdo</p>

            <!-- Mensajes -->
            <div id="mensaje-exito" class="mensaje-exito"> Venta registrada exitosamente</div>
            <div id="mensaje-error" class="mensaje-error"> Error al registrar la venta</div>

            <!-- Formulario -->
            <form id="form-nueva-venta">
                <div class="form-group">
                    <label for="nombre">Nombre del comprador *</label>
                    <input type="text" id="nombre" placeholder="Ej: Pedro Pérez" required>
                </div>

                <div class="form-group">
                    <label for="producto">Producto *</label>
                    <input type="text" id="producto" placeholder="Ej: Cerdo 85kg" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="valor">Valor total ($) *</label>
                        <input type="number" id="valor" placeholder="598500" required min="1">
                    </div>
                    <div class="form-group">
                        <label for="pago-inicial">Pago inicial ($)</label>
                        <input type="number" id="pago-inicial" placeholder="300000" min="0" value="0">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="metodo-pago">Método de pago *</label>
                        <select id="metodo-pago" required>
                            <option value="efectivo">💵 Efectivo</option>
                            <option value="transferencia">🏦 Transferencia</option>
                            <option value="nequi">📱 Nequi</option>
                            <option value="daviplata">📱 Daviplata</option>
                            <option value="pendiente">⏳ Pendiente</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fecha-sacrificio">Fecha de sacrificio</label>
                        <input type="date" id="fecha-sacrificio">
                    </div>
                </div>

                <button type="submit" class="btn btn-submit">✅ Registrar Venta</button>
            </form>

            <a href="ventas.html" class="btn btn-volver">⬅ Volver a Ventas</a>
        </div>

        <footer>
            <p>🐖 Sistema de Gestión Porcina v1.0</p>
        </footer>
    </div>

    <!-- BOTÓN MODO OSCURO -->
    <button id="btn-dark-mode" title="Cambiar tema">🌙</button>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/nueva_venta.js"></script>
</body>
</html>

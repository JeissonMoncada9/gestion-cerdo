<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐖 Detalle de Venta</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <nav>
            <h1>🐖 PORCINOS</h1>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="ventas.html" class="active">Ventas</a></li>
                <li><a href="gastos.html">Gastos</a></li>
            </ul>
        </nav>

        <!-- ESTRUCTURA TIPO FACTURA -->
        <div class="factura-header">
            <h2>🧾 Factura de Venta</h2>
            <div class="factura-numero">
                <strong>ID:</strong> <span id="factura-id">Cargando...</span>
            </div>
        </div>

        <div class="detalle-card" id="detalle-venta">
            <div class="loading">⏳ Cargando detalles...</div>
        </div>

        <!-- HISTORIAL DE PAGOS TIPO FACTURA -->
        <div class="historial-pagos-factura">
            <h3>📜 Historial de Pagos</h3>
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Monto</th>
                        <th>Método</th>
                    </tr>
                </thead>
                <tbody id="historial-pagos">
                    <tr>
                        <td colspan="3" class="historial-vacio">No hay pagos registrados</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- REGISTRAR NUEVO ABONO -->
        <div class="form-abono">
            <h3 style="margin-bottom: 15px; color: var(--gris-texto);">💰 Registrar Nuevo Abono</h3>
            <form id="form-abono">
                <div>
                    <label for="monto-abono">Monto del abono ($):</label>
                    <input type="number" id="monto-abono" placeholder="Ej: 100000" required min="1" step="0.01">
                </div>
                <div>
                    <label for="metodo-abono">Método de pago:</label>
                    <select id="metodo-abono">
                        <option value="efectivo">Efectivo</option>
                        <option value="transferencia">Transferencia</option>
                        <option value="nequi">Nequi</option>
                        <option value="daviplata">Daviplata</option>
                    </select>
                </div>
                <button type="submit" class="btn">✅ Registrar Abono</button>
            </form>
        </div>

        <a href="ventas.html" class="btn btn-volver">⬅ Volver a Ventas</a>

        <footer>
            <p>🐖 Sistema de Gestión Porcina v1.0</p>
        </footer>
    </div>

    <!-- BOTÓN MODO OSCURO -->
    <button id="btn-dark-mode" title="Cambiar tema">🌙</button>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/detalle_venta.js"></script>
</body>
</html>

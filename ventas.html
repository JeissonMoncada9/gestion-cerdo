<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐖 Gestión de Ventas</title>
    <link rel="stylesheet" href="css/estilo.css">
    <style>
        /* ===== ESTILOS PARA AGRUPACIÓN POR FECHA ===== */
        .grupo-fecha {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            overflow: hidden;
        }
        .grupo-fecha-header {
            background: #2d7d46;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.3s;
        }
        .grupo-fecha-header:hover {
            background: #1e5a32;
        }
        .grupo-fecha-header h3 {
            font-size: 18px;
            margin: 0;
        }
        .grupo-fecha-header .resumen-dia {
            display: flex;
            gap: 20px;
            font-size: 14px;
            flex-wrap: wrap;
        }
        .grupo-fecha-header .resumen-dia span {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
        }
        .grupo-fecha-body {
            padding: 0;
            overflow-x: auto;
        }
        .grupo-fecha-body table {
            margin: 0;
            border-radius: 0;
        }
        .grupo-fecha-body table thead {
            background: #e8f5e9;
            color: #2d7d46;
        }
        .total-dia {
            padding: 12px 20px;
            background: #f8f5f0;
            text-align: right;
            font-weight: bold;
            border-top: 2px solid #e8e0d8;
        }
        .total-dia .ganancia {
            color: #2e7d32;
        }
        .total-dia .perdida {
            color: #d32f2f;
        }

        /* ===== RESUMEN GLOBAL ===== */
        .resumen-global {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin: 20px 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            text-align: center;
        }
        .resumen-global .item {
            padding: 10px;
        }
        .resumen-global .item .numero {
            font-size: 28px;
            font-weight: bold;
        }
        .resumen-global .item .label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .verde {
            color: #2e7d32;
        }
        .rojo {
            color: #d32f2f;
        }

        /* ===== FILTROS ===== */
        .filtros {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .filtros input, .filtros select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            flex: 1;
            min-width: 150px;
        }
        .filtros button {
            padding: 10px 20px;
            background: #2d7d46;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .filtros button:hover {
            background: #1e5a32;
        }
        .btn-limpiar {
            background: #666 !important;
        }
        .btn-limpiar:hover {
            background: #444 !important;
        }

        /* ===== BOTONES ===== */
        .btn-accion {
            display: inline-block;
            margin: 10px 10px 20px 0;
        }
        .btn-eliminar-venta {
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 12px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-eliminar-venta:hover {
            background: #b71c1c;
        }
        .btn-ver-venta {
            background: #2d7d46;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 12px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
            margin-right: 5px;
        }
        .btn-ver-venta:hover {
            background: #1e5a32;
        }

        /* ===== BADGES ===== */
        .badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .badge-pendiente {
            background: #ffebee;
            color: #d32f2f;
        }
        .badge-completado {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .estado-pendiente {
            color: #d32f2f;
            font-weight: bold;
        }
        .estado-completado {
            color: #2e7d32;
            font-weight: bold;
        }

        /* ===== MENSAJES ===== */
        .sin-ventas {
            text-align: center;
            padding: 40px;
            color: #666;
            background: white;
            border-radius: 12px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .grupo-fecha-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .grupo-fecha-header .resumen-dia {
                font-size: 12px;
            }
            .resumen-global {
                grid-template-columns: repeat(2, 1fr);
            }
            .resumen-global .item .numero {
                font-size: 20px;
            }
            .filtros input, .filtros select {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- MENÚ -->
        <nav>
            <h1>🐖 PORCINOS</h1>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="ventas.html" class="active">Ventas</a></li>
                <li><a href="gastos.html">Gastos</a></li>
            </ul>
        </nav>

        <!-- TÍTULO Y BOTÓN -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin: 20px 0;">
            <h2>📋 Registro de Ventas</h2>
            <a href="nueva-venta.html" class="btn btn-accion">➕ Nueva Venta</a>
        </div>

        <!-- FILTROS -->
        <div class="filtros">
            <input type="text" id="filtro-cliente" placeholder="🔍 Buscar por cliente...">
            <input type="date" id="filtro-fecha" placeholder="📅 Filtrar por fecha">
            <select id="filtro-estado">
                <option value="todos">Todos los estados</option>
                <option value="pendiente">⏳ Pendiente</option>
                <option value="completado">✅ Completado</option>
            </select>
            <button id="btn-filtrar">🔍 Filtrar</button>
            <button id="btn-limpiar" class="btn-limpiar">🧹 Limpiar</button>
        </div>

        <!-- ===== RESUMEN GLOBAL ===== -->
        <div class="resumen-global" id="resumen-global">
            <div class="item">
                <div class="numero verde" id="total-ventas-global">$0</div>
                <div class="label">💰 Total Ventas</div>
            </div>
            <div class="item">
                <div class="numero rojo" id="total-gastos-global">$0</div>
                <div class="label">📉 Total Gastos</div>
            </div>
            <div class="item">
                <div class="numero" id="total-ganancia-global">$0</div>
                <div class="label">📈 Ganancia Neta</div>
            </div>
            <div class="item">
                <div class="numero" id="total-ventas-count">0</div>
                <div class="label">📊 Total Ventas</div>
            </div>
        </div>

        <!-- CONTENEDOR DE VENTAS AGRUPADAS -->
        <div id="contenedor-ventas">
            <div class="sin-ventas">⏳ Cargando ventas...</div>
        </div>

        <footer>
            <p>🐖 Sistema de Gestión Porcina v1.0 | Ventas protegidas - Eliminación con doble confirmación</p>
        </footer>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { supabaseClient } from './js/config.js';

        console.log("📄 Página de ventas cargada");

        let todasLasVentas = [];
        let todosLosGastos = [];

        // ============================================
        // 1. CARGAR DATOS DESDE SUPABASE
        // ============================================
        async function cargarDatos() {
            try {
                console.log("🔄 Cargando datos...");

                const { data: ventas, error: errorVentas } = await supabaseClient
                    .from('ingresos')
                    .select('*')
                    .order('fecha_sacrificio', { ascending: false });

                if (errorVentas) throw errorVentas;

                const { data: gastos, error: errorGastos } = await supabaseClient
                    .from('gastos')
                    .select('*');

                if (errorGastos) throw errorGastos;

                todasLasVentas = ventas;
                todosLosGastos = gastos;

                console.log(`✅ ${ventas.length} ventas y ${gastos.length} gastos cargados`);
                
                // Actualizar resumen global
                actualizarResumenGlobal(ventas, gastos);
                
                // Mostrar ventas agrupadas
                mostrarVentasAgrupadas(ventas, gastos);

            } catch (error) {
                console.error("❌ Error:", error);
                document.getElementById('contenedor-ventas').innerHTML = `
                    <div class="sin-ventas" style="color: #d32f2f;">
                        ❌ Error al cargar los datos: ${error.message}
                    </div>
                `;
            }
        }

        // ============================================
        // 2. AGRUPAR VENTAS POR FECHA
        // ============================================
        function agruparVentasPorFecha(ventas) {
            const grupos = {};
            
            ventas.forEach(venta => {
                const fecha = venta.fecha_sacrificio || venta.creado_en?.split('T')[0] || 'Sin fecha';
                if (!grupos[fecha]) {
                    grupos[fecha] = [];
                }
                grupos[fecha].push(venta);
            });
            
            const fechasOrdenadas = Object.keys(grupos).sort((a, b) => {
                if (a === 'Sin fecha') return 1;
                if (b === 'Sin fecha') return -1;
                return new Date(b) - new Date(a);
            });
            
            const resultado = {};
            fechasOrdenadas.forEach(fecha => {
                resultado[fecha] = grupos[fecha];
            });
            
            return resultado;
        }

        // ============================================
        // 3. CALCULAR GASTOS POR FECHA
        // ============================================
        function calcularGastosPorFecha(gastos) {
            const gastosPorFecha = {};
            gastos.forEach(gasto => {
                const fecha = gasto.fecha;
                if (!gastosPorFecha[fecha]) {
                    gastosPorFecha[fecha] = 0;
                }
                gastosPorFecha[fecha] += gasto.monto;
            });
            return gastosPorFecha;
        }

        // ============================================
        // 4. MOSTRAR VENTAS AGRUPADAS
        // ============================================
        function mostrarVentasAgrupadas(ventas, gastos) {
            const container = document.getElementById('contenedor-ventas');
            
            if (!ventas || ventas.length === 0) {
                container.innerHTML = `
                    <div class="sin-ventas">
                        📭 No hay ventas registradas
                        <br><br>
                        <a href="nueva-venta.html" class="btn">➕ Registrar primera venta</a>
                    </div>
                `;
                return;
            }

            const ventasPorFecha = agruparVentasPorFecha(ventas);
            const gastosPorFecha = calcularGastosPorFecha(gastos);
            
            let html = '';

            for (const [fecha, ventasDelDia] of Object.entries(ventasPorFecha)) {
                const totalVentasDia = ventasDelDia.reduce((sum, v) => sum + v.valor, 0);
                const totalGastosDia = gastosPorFecha[fecha] || 0;
                const gananciaDia = totalVentasDia - totalGastosDia;
                
                const fechaFormateada = fecha === 'Sin fecha' ? '📅 Sin fecha' : formatFecha(fecha);
                const gananciaIcon = gananciaDia >= 0 ? '📈' : '📉';
                const gananciaClass = gananciaDia >= 0 ? 'ganancia' : 'perdida';

                html += `
                    <div class="grupo-fecha">
                        <div class="grupo-fecha-header">
                            <h3>📅 ${fechaFormateada}</h3>
                            <div class="resumen-dia">
                                <span>💰 Ventas: $${totalVentasDia.toLocaleString()}</span>
                                <span>📉 Gastos: $${totalGastosDia.toLocaleString()}</span>
                                <span class="${gananciaClass}">${gananciaIcon} Ganancia: $${gananciaDia.toLocaleString()}</span>
                                <span>📊 ${ventasDelDia.length} ventas</span>
                            </div>
                        </div>
                        <div class="grupo-fecha-body">
                            <table class="tabla">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Cliente</th>
                                        <th>Producto</th>
                                        <th>Total</th>
                                        <th>Pagado</th>
                                        <th>Deuda</th>
                                        <th>Estado</th>
                                        <th>Método</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;

                ventasDelDia.forEach((venta, index) => {
                    const estado = venta.pago_pendiente === 0 ? 'completado' : 'pendiente';
                    const badgeClass = estado === 'completado' ? 'badge-completado' : 'badge-pendiente';
                    const badgeText = estado === 'completado' ? '✅ Completado' : '⏳ Pendiente';
                    
                    html += `
                        <tr>
                            <td>${index + 1}</td>
                            <td><strong>${venta.nombre}</strong></td>
                            <td>${venta.producto}</td>
                            <td>$${venta.valor.toLocaleString()}</td>
                            <td>$${venta.pago_realizado.toLocaleString()}</td>
                            <td class="${estado === 'completado' ? 'estado-completado' : 'estado-pendiente'}">
                                $${venta.pago_pendiente.toLocaleString()}
                            </td>
                            <td><span class="badge ${badgeClass}">${badgeText}</span></td>
                            <td>${venta.metodo_pago || '-'}</td>
                            <td>
                                <a href="detalle-venta.html?id=${venta.id}" class="btn-ver-venta">👁️ Ver</a>
                                <button class="btn-eliminar-venta" data-id="${venta.id}" data-nombre="${venta.nombre}">
                                    🗑️
                                </button>
                            </td>
                        </tr>
                    `;
                });

                html += `
                                </tbody>
                            </table>
                        </div>
                        <div class="total-dia">
                            <span>💰 Total Ventas: $${totalVentasDia.toLocaleString()} | </span>
                            <span>📉 Gastos: $${totalGastosDia.toLocaleString()} | </span>
                            <span class="${gananciaClass}">${gananciaIcon} Ganancia del día: $${gananciaDia.toLocaleString()}</span>
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = html;

            // ============================================
            // CONECTAR BOTONES DE ELIMINAR
            // ============================================
            document.querySelectorAll('.btn-eliminar-venta').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    const nombre = this.dataset.nombre;
                    eliminarVenta(id, nombre);
                });
            });

            actualizarResumenGlobal(ventas, gastos);
        }

        // ============================================
        // 5. ELIMINAR VENTA (CON DOBLE CONFIRMACIÓN)
        // ============================================
        async function eliminarVenta(id, nombre) {
            // Primera confirmación
            const confirmar1 = confirm(`⚠️ ¿Estás seguro de eliminar la venta de "${nombre}"?`);
            if (!confirmar1) return;
            
            // Segunda confirmación (escribir "ELIMINAR")
            const confirmar2 = prompt(
                `⚠️ CONFIRMACIÓN FINAL\n\n` +
                `Venta: ${nombre}\n` +
                `Esta acción NO se puede deshacer.\n\n` +
                `Escribe "ELIMINAR" para confirmar:`
            );
            
            if (confirmar2 !== "ELIMINAR") {
                alert("❌ Eliminación cancelada");
                return;
            }

            try {
                const { error } = await supabaseClient
                    .from('ingresos')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                alert(`✅ Venta de "${nombre}" eliminada correctamente`);
                
                // Recargar los datos
                await cargarDatos();

            } catch (error) {
                alert("❌ Error al eliminar: " + error.message);
            }
        }

        // ============================================
        // 6. ACTUALIZAR RESUMEN GLOBAL
        // ============================================
        function actualizarResumenGlobal(ventas, gastos) {
            const totalVentas = ventas.reduce((sum, v) => sum + v.valor, 0);
            const totalGastos = gastos.reduce((sum, g) => sum + g.monto, 0);
            const gananciaNeta = totalVentas - totalGastos;
            
            document.getElementById('total-ventas-global').textContent = `$${totalVentas.toLocaleString()}`;
            document.getElementById('total-gastos-global').textContent = `$${totalGastos.toLocaleString()}`;
            
            const gananciaEl = document.getElementById('total-ganancia-global');
            gananciaEl.textContent = `$${gananciaNeta.toLocaleString()}`;
            gananciaEl.style.color = gananciaNeta >= 0 ? '#2e7d32' : '#d32f2f';
            
            document.getElementById('total-ventas-count').textContent = ventas.length;
        }

        // ============================================
        // 7. FORMATO DE FECHA
        // ============================================
        function formatFecha(fechaStr) {
            if (!fechaStr || fechaStr === 'Sin fecha') return fechaStr;
            try {
                const fecha = new Date(fechaStr + 'T00:00:00');
                if (isNaN(fecha.getTime())) return fechaStr;
                const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
                const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                return `${dias[fecha.getDay()]}, ${fecha.getDate()} de ${meses[fecha.getMonth()]} de ${fecha.getFullYear()}`;
            } catch (e) {
                return fechaStr;
            }
        }

        // ============================================
        // 8. FILTROS
        // ============================================
        document.getElementById('btn-filtrar').addEventListener('click', function() {
            const filtroCliente = document.getElementById('filtro-cliente').value.toLowerCase().trim();
            const filtroFecha = document.getElementById('filtro-fecha').value;
            const filtroEstado = document.getElementById('filtro-estado').value;
            
            let ventasFiltradas = todasLasVentas;
            
            if (filtroCliente) {
                ventasFiltradas = ventasFiltradas.filter(v => 
                    v.nombre.toLowerCase().includes(filtroCliente)
                );
            }
            if (filtroFecha) {
                ventasFiltradas = ventasFiltradas.filter(v => 
                    v.fecha_sacrificio === filtroFecha
                );
            }
            if (filtroEstado !== 'todos') {
                ventasFiltradas = ventasFiltradas.filter(v => {
                    const estado = v.pago_pendiente === 0 ? 'completado' : 'pendiente';
                    return estado === filtroEstado;
                });
            }
            
            mostrarVentasAgrupadas(ventasFiltradas, todosLosGastos);
            actualizarResumenGlobal(ventasFiltradas, todosLosGastos);
        });

        document.getElementById('btn-limpiar').addEventListener('click', function() {
            document.getElementById('filtro-cliente').value = '';
            document.getElementById('filtro-fecha').value = '';
            document.getElementById('filtro-estado').value = 'todos';
            mostrarVentasAgrupadas(todasLasVentas, todosLosGastos);
            actualizarResumenGlobal(todasLasVentas, todosLosGastos);
        });

        // ============================================
        // 9. EJECUTAR AL CARGAR
        // ============================================
        window.onload = cargarDatos;
    </script>
</body>
</html>

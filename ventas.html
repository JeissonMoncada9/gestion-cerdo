<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐖 Gestión de Ventas</title>
    <!-- Usamos el CSS unificado -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="container">
        <!-- MENÚ -->
        <nav>
            <h1>🐖 PORCINOS</h1>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="ventas.html" class="active">Ventas</a></li>
                <li><a href="gastos.html">Gastos</a></li>
            </ul>
        </nav>

        <!-- TÍTULO Y BOTÓN -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin: 20px 0;">
            <h2>📋 Registro de Ventas</h2>
            <a href="nueva-venta.html" class="btn btn-accion">➕ Nueva Venta</a>
        </div>

        <!-- FILTROS -->
        <div class="filtros">
            <input type="text" id="filtro-cliente" placeholder="🔍 Buscar por cliente...">
            <input type="date" id="filtro-fecha" placeholder="📅 Filtrar por fecha">
            <select id="filtro-estado">
                <option value="todos">Todos los estados</option>
                <option value="pendiente">⏳ Pendiente</option>
                <option value="completado">✅ Completado</option>
            </select>
            <button id="btn-filtrar">🔍 Filtrar</button>
            <button id="btn-limpiar" class="btn-limpiar">🧹 Limpiar</button>
        </div>

        <!-- ===== RESUMEN GLOBAL ===== -->
        <div class="resumen-global" id="resumen-global">
            <div class="item">
                <div class="numero verde" id="total-ventas-global">$0</div>
                <div class="label">💰 Total Ventas</div>
            </div>
            <div class="item">
                <div class="numero rojo" id="total-gastos-global">$0</div>
                <div class="label">📉 Total Gastos</div>
            </div>
            <div class="item">
                <div class="numero" id="total-ganancia-global">$0</div>
                <div class="label">📈 Ganancia Neta</div>
            </div>
            <div class="item">
                <div class="numero" id="total-ventas-count">0</div>
                <div class="label">📊 Total Ventas</div>
            </div>
        </div>

        <!-- CONTENEDOR DE VENTAS AGRUPADAS -->
        <div id="contenedor-ventas">
            <div class="sin-ventas">⏳ Cargando ventas...</div>
        </div>

        <footer>
            <p>🐖 Sistema de Gestión Porcina v1.0 | Ventas protegidas - Eliminación con doble confirmación</p>
        </footer>
    </div>

    <!-- Librerías CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Nuestro JavaScript externo -->
    <script type="module" src="js/ventas.js"></script>

    <button id="btn-dark-mode" title="Cambiar tema">🌙</button>
</body>
</html>
